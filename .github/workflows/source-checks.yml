name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install source-test dependencies (no Wine or commercial media)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 ripgrep desktop-file-utils shellcheck python3-gi
      - run: ./tests/static-check.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: ./bin/build-helpers.sh
      - run: python3 bin/audit-repository.py --staged
